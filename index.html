    <!-- Installed from the home screen: no browser chrome, both orientations (the Fullscreen API has no
         page-level call on iPhone Safari: the installed app, or the largest the browser offers, is it). -->

    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="description" content="They took the bag. He came back for it, one frozen second at a time. A noir bullet-time shooter in the browser with the Radbros." />

    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <!-- Bebas Neue + Courier Prime (SIL OFL 1.1, public/fonts), latin, self-hosted: the title waits for them (a build asks for them by versioned URLs: vite.config.ts) -->
    <link rel="preload" href="/fonts/bebas-neue-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/courier-prime-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/courier-prime-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/courier-prime-700-italic.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Bebas Neue'; font-style: normal; font-weight: 400; font-display: block; src: url(/fonts/bebas-neue-400.woff2) format('woff2'); }
      @font-face { font-family: 'Courier Prime'; font-style: normal; font-weight: 400; font-display: block; src: url(/fonts/courier-prime-400.woff2) format('woff2'); }
      @font-face { font-family: 'Courier Prime'; font-style: normal; font-weight: 700; font-display: block; src: url(/fonts/courier-prime-700.woff2) format('woff2'); }
      @font-face { font-family: 'Courier Prime'; font-style: italic; font-weight: 700; font-display: block; src: url(/fonts/courier-prime-700-italic.woff2) format('woff2'); }
      :root {
        /* every side of the screen the hardware keeps for itself (the notch in landscape, the island and
           the home indicator in portrait): read once here, so a test can stand stand-ins in */
        --sai-top: env(safe-area-inset-top, 0px);
        --sai-right: env(safe-area-inset-right, 0px);
        --sai-bottom: env(safe-area-inset-bottom, 0px);
        --sai-left: env(safe-area-inset-left, 0px);
        --app-h: 100dvh;
        color-scheme: dark;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      html, body { margin: 0; height: 100%; width: 100%; background: #05060c; overflow: hidden; overscroll-behavior: none; }
      body {
        position: fixed; inset: 0;
        font: 700 17px/1.4 'Courier Prime', 'Courier New', monospace; color: #f3ead8;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation; overscroll-behavior: none;
      }
      #root { position: fixed; inset: 0; height: 100dvh; height: var(--app-h, 100dvh); overflow: hidden; touch-action: manipulation; }
      #root canvas { display: block; touch-action: none; }
      @supports not (height: 100dvh) { #root { height: 100%; } }
      a { color: inherit; -webkit-touch-callout: default; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/vyvanse-pad.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
